name: CI/CD ExpenseFlow

on:
  pull_request:
    branches:
      - main
      - development

  push:
    branches:
      - main
      - development

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Give permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/expenseflow-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/expenseflow-api:${{ github.sha }}